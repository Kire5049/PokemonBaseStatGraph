<!DOCTYPE html>
<html>
    <head>
        <title>
            Base Stat Graph
        </title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <div>
            <label>Hp</label>
            <input type="number" id="hp">
            <label>Atk</label>
            <input type="number" id="atk">
            <label>Def</label>
            <input type="number" id="def">
            <label>SpAtk</label>
            <input type="number" id="spatk">
            <label>SpDef</label>
            <input type="number" id="spdef">
            <label>Speed</label>
            <input type="number" id="speed">
            <label>Type 1</label>
            <select name="Type 1" id="type1">
                <option value="Normal" class="Normal">Normal</option>
                <option value="Fire" class="Fire">Fire</option>
                <option value="Fighting" class="Fighting">Fighting</option>
                <option value="Water" class="Water">Water</option>
                <option value="Flying" class="Flying">Flying</option>
                <option value="Grass" class="Grass">Grass</option>
                <option value="Poison" class="Poison">Poison</option>
                <option value="Electric" class="Electric">Electric</option>
                <option value="Ground" class="Ground">Ground</option>
                <option value="Psychic" class="Psychic">Psychic</option>
                <option value="Rock" class="Rock">Rock</option>
                <option value="Ice" class="Ice">Ice</option>
                <option value="Bug" class="Bug">Bug</option>
                <option value="Dragon" class="Dragon">Dragon</option>
                <option value="Ghost" class="Ghost">Ghost</option>
                <option value="Steel" class="Steel">Steel</option>
                <option value="Fairy" class="Fairy">Fairy</option>
            </select>
            <label>Type 2</label>
            <select name="Type 2" id="type2">
                <option value="none" id="none">None</option>
                <option value="Normal" class="Normal">Normal</option>
                <option value="Fire" class="Fire">Fire</option>
                <option value="Fighting" class="Fighting">Fighting</option>
                <option value="Water" class="Water">Water</option>
                <option value="Flying" class="Flying">Flying</option>
                <option value="Grass" class="Grass">Grass</option>
                <option value="Poison" class="Poison">Poison</option>
                <option value="Electric" class="Electric">Electric</option>
                <option value="Ground" class="Ground">Ground</option>
                <option value="Psychic" class="Psychic">Psychic</option>
                <option value="Rock" class="Rock">Rock</option>
                <option value="Ice" class="Ice">Ice</option>
                <option value="Bug" class="Bug">Bug</option>
                <option value="Dragon" class="Dragon">Dragon</option>
                <option value="Ghost" class="Ghost">Ghost</option>
                <option value="Steel" class="Steel">Steel</option>
                <option value="Fairy" class="Fairy">Fairy</option>
            </select>
        </div>
        <div>
            <label>Name</label>
            <input type="text" id="name">
        </div>

        <table id="type" class="table table-bordered table-striped table-fixed">
            <tbody>
                <tr id="Stat">
                    <th colspan="2" rowspan="2">Stat</th>
                    <th colspan="2">Range</th>
                </tr>
                <tr id="Ranges">
                    <th><small>Lvl 50</small></th>
                    <th><small>Lvl 100</small></th>
                </tr>
                <tr id="hp" style="background: #9EE865; text-align: center;">
                    <th style="padding-left: 0.2em; padding-right: 0.2em; display: flex; justify-content: space-between;">
                        <div><a>HP</a>:</div>
                        <div id="HpNum"></div>
                    </th>
                    <td style="width: 255px;">
                        <span id="stathp"></span>
                    </td>
                    <td id="hplvl50"></td>
                    <td id="hplvl100"></td>
                </tr>
                <tr id="atk" style="background: #F5DE69; text-align: center;">
                    <th style="padding-left: 0.2em; padding-right: 0.2em; display: flex; justify-content: space-between;">
                        <div><a>Attack</a>:</div>
                        <div id="AtkNum"></div>
                    </th>
                    <td style="width: 255px;">
                        <span id="statatk"></span>
                    </td>
                    <td id="atklvl50"></td>
                    <td id="atklvl100"></td>
                </tr>
                <tr id="def" style="background: #F09A65; text-align: center;">
                    <th style="padding-left: 0.2em; padding-right: 0.2em; display: flex; justify-content: space-between;">
                        <div><a>Defense</a>:</div>
                        <div id="DefNum"></div>
                    </th>
                    <td style="width: 255px;" >
                        <span id="statdef"></span>
                    </td>
                    <td id="deflvl50"></td>
                    <td id="deflvl100"></td>
                </tr>
                <tr id="spatk" style="background: #66D8F6; text-align: center;">
                    <th style="padding-left: 0.2em; padding-right: 0.2em; display: flex; justify-content: space-between;">
                        <div><a>Sp.Attack</a>:</div>
                        <div id="SpAtkNum"></div>
                    </th>
                    <td style="width: 255px;">
                        <span id="statspatk"></span>
                    </td>
                    <td id="spatklvl50"></td>
                    <td id="spatklvl100"></td>
                </tr>
                <tr id="spdef" style="background: #899EEA; text-align: center;">
                    <th style="padding-left: 0.2em; padding-right: 0.2em; display: flex; justify-content: space-between;">
                        <div><a>Sp.Def</a>:</div>
                        <div id="SpDefNum"></div>
                    </th>
                    <td style="width: 255px;">
                        <span id="statspdef"></span>
                    </td>
                    <td id="spdeflvl50"></td>
                    <td id="spdeflvl100"></td>
                </tr>
                <tr id="speed" style="background: #E46CCA; text-align: center;">
                    <th style="padding-left: 0.2em; padding-right: 0.2em; display: flex; justify-content: space-between;">
                        <div><a>Speed</a>:</div>
                        <div id="SpeedNum"></div>
                    </th>
                    <td style="width: 255px;">
                        <span id="statspeed"></span>
                    </td>
                    <td id="speedlvl50"></td>
                    <td id="speedlvl100"></td>
                </tr>
                <tr id="stat">
                    <th style="width: 6.5em; padding-left: 0.2em; padding-right: 0.2em; display: flex; justify-content: space-between;">
                        <div>Total:</div>
                        <div id="valuetotal"></div>
                    </th>
                    <td colspan="3"></td>
                </tr>
            </tbody>
        </table>

        <script src="script.js" type="text/javascript"></script>

        <button onclick="FuncGraph();">Generate Graph</button>
        
        <button id="convert">Convert to image</button>

        <div id="result"></div>
        <script type="text/javascript" src="html2canvas.js"></script>
        <script>
            function convertToImage() {
    var resultDiv = document.getElementById("result");
            html2canvas(document.getElementById("type"), {
                onrendered: function(canvas) {
                    var img = canvas.toDataURL("image/png");
                    var pokeName = document.getElementById("name").value;
                    result.innerHTML = '<a download="'+pokeName+'.png" href="'+img+'">'+pokeName+'</a>';
                    }
            });
}
var convertBtn = document.getElementById("convert");
         convertBtn.addEventListener('click', convertToImage)
        </script>
    </body>
</html>
